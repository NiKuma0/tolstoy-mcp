name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # postinstall onnxruntime-node докачивает CUDA, а нам нужен только CPU из самого пакета
      - run: npm ci --ignore-scripts
      - run: npm run lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
